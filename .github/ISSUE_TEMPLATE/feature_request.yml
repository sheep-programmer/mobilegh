name: 功能建议
description: 提出新功能或改进现有功能的想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请尽量说明**你想解决什么问题**，而不只是想要的界面形式，这样更容易找到合适的方案。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，没有找到相同的建议
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题或需求
      description: 目前在什么场景下觉得不方便，想解决什么问题
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的功能
      description: 你希望应用怎么做。可以附上草图、参考截图或参考其他应用的做法
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否尝试过其他办法，例如在网页版或官方 App 里怎么做
    validations:
      required: false

  - type: input
    id: app_version
    attributes:
      label: 应用版本
      description: 提出建议时使用的版本号，例如 0.32.0
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与方式
      options:
        - label: 我愿意参与测试或提交 Pull Request
          required: false
